    <rect x="14" y="62" width="362" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <path d="M24 84h13m-5-5-5 5 5 5" fill="none" stroke="#2457A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="89" class="small" fill="#2457A7" font-weight="600">Zurück zur Ticketliste</text>

    <text x="18" y="132" class="tiny muted">Planungsoberfläche › Ticketdetails<title>Schlichte Planungsoberfläche für Heistman gestalten und umsetzen</title></text>
    <text x="18" y="166" font-size="19" font-weight="650">Planungsdokumente und</text>
    <text x="18" y="190" font-size="19" font-weight="650">Projektübersicht gestalten</text>
    <text x="18" y="218" class="small muted">Status: Offen · Priorität: Normal</text>
    <rect x="14" y="242" width="362" height="62" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="30" y="267" class="section">Elternpfad</text>
    <text x="30" y="287" class="small muted">Planungsoberfläche für Heistman …<title>Schlichte Planungsoberfläche für Heistman gestalten und umsetzen</title></text>

    <text x="18" y="339" class="section">Beziehungen · 4</text>
    <text x="18" y="360" class="tiny muted">Eingehende und ausgehende Verknüpfungen</text>

    <rect x="14" y="374" width="362" height="108" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="396" class="label">WIRD BLOCKIERT VON</text>
    <text x="28" y="420" class="body" fill="#2457A7" text-decoration="underline">Schlichtes UI-Konzept mit klaren</text>
    <text x="28" y="439" class="body" fill="#2457A7" text-decoration="underline">Planungsabläufen festhalten</text>
    <text x="28" y="463" class="tiny muted">Beziehung: blocks · eingehend</text>

    <rect x="14" y="490" width="362" height="88" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="512" class="label">BLOCKIERT</text>
    <text x="28" y="536" class="body" fill="#2457A7" text-decoration="underline">UI visuell prüfen und verfeinern</text>
    <text x="28" y="559" class="tiny muted">Beziehung: blocks · ausgehend</text>

    <rect x="14" y="586" width="362" height="108" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="608" class="label">BEZIEHT SICH AUF</text>
    <text x="28" y="632" class="body" fill="#2457A7" text-decoration="underline">Deutsche UI-Beschriftungen und</text>
    <text x="28" y="651" class="body" fill="#2457A7" text-decoration="underline">Rückmeldungen durchgängig planen</text>
    <text x="28" y="675" class="tiny muted">Beziehung: relates_to</text>

    <rect x="14" y="702" width="362" height="108" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="724" class="label">BEZIEHT SICH AUF</text>
    <text x="28" y="748" class="body" fill="#2457A7" text-decoration="underline">Responsive Darstellung und</text>
    <text x="28" y="767" class="body" fill="#2457A7" text-decoration="underline">Barrierefreiheit ausarbeiten</text>
    <text x="28" y="791" class="tiny muted">Beziehung: relates_to</text>
  </g>

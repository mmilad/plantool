<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1720" viewBox="0 0 1280 1720" role="img" aria-labelledby="title desc">
  <title id="title">Heistman — Variante A gewählt, B und C verworfen</title>
  <desc id="desc">Drei statische Desktoplayouts mit denselben heist-Bereichen. Gewählt ist A mit horizontaler Hauptnavigation und schmaler Ticketliste neben dem Detail. B, die dauerhaft breite Bereichsleiste, und C, die einklappbare Sidebar, sind verworfene Alternativen. Keine Projektumschaltung und nur vorhandene heist-Semantik.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="920" viewBox="0 0 320 920" role="img" aria-labelledby="title desc">
  <title id="title">Plan UI-Entwurf — Ticketliste bei 320 Pixeln</title>
  <desc id="desc">Statische schmale Ticketliste mit sieben echten UI-Programmtickets, sichtbarem Status, Priorität und getrenntem Bereitschaftshinweis. Ein 44-Pixel-Einstieg öffnet kombinierbare Filter für Status, Priorität, Labels und Hierarchiebereich; drei weitere Einträge sind scrollbar.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 20px; font-weight: 650; }
      .ticket { font-size: 12px; font-weight: 600; }
      .ready { fill: #14532D; }
      .critical { fill: #9B1C1C; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
      .nav-icon { fill: none; stroke: #5A687A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .nav-icon-active { fill: none; stroke: #2457A7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="320" height="920" fill="#F6F7F9"/>

  <rect width="320" height="52" fill="#FFFFFF"/>
  <path d="M0 51.5H320" stroke="#D8DEE7"/>
  <rect x="12" y="11" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M20.75 20.375h12.5M20.75 25.375h12.5M20.75 30.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="52" y="25" font-size="14" font-weight="650">Plan</text>
  <text x="52" y="40" class="tiny muted">plan</text>

  <rect x="12" y="57" width="296" height="44" rx="6" fill="#2457A7"/>
  <path d="M110 79h10m-5-5v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="126" y="83" class="small inverse" font-weight="600">Ticket erstellen</text>

  <rect x="12" y="109" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="29" cy="131" r="5" fill="none" stroke="#5A687A" stroke-width="1.3"/>
  <path d="m32.5 134.5 3 3" stroke="#5A687A" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="135" class="small muted">Im Projekt suchen</text>

  <rect y="158" width="320" height="44" fill="#FFFFFF"/>
  <path d="M0 201.5H320" stroke="#D8DEE7"/>
  <use href="#nav-house" x="10" y="170" width="20" height="20" class="nav-icon"/>
  <text x="35" y="185" class="small muted">Übersicht</text>
  <use href="#nav-ticket" x="96" y="170" width="20" height="20" class="nav-icon-active"/>
  <text x="121" y="185" class="small blue" font-weight="650">Tickets</text>
  <use href="#nav-documents" x="172" y="170" width="20" height="20" class="nav-icon"/>
  <text x="198" y="185" class="small muted">Planungsdokumente</text>
  <rect x="94" y="198" width="74" height="3" rx="1.5" fill="#2457A7"/>

  <text x="14" y="224" class="tiny muted">TICKETS · UI-PROGRAMM</text>
  <text x="14" y="251" class="title">UI-Programm</text>
  <text x="14" y="270" class="tiny muted">10 direkte Arbeitspakete · 1 in Arbeit</text>

  <rect x="12" y="280" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
  <text x="26" y="307" class="small">Filter: Status · Priorität · Labels · Bereich</text>
  <text x="290" y="307" class="small muted" text-anchor="end">▾</text>

  <g>
    <rect x="12" y="334" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="352" class="ticket">UI-Richtung und Informationsarchitektur</text>
    <text x="22" y="366" class="ticket">festlegen</text>
    <text x="22" y="379" class="tiny muted">Status · Offen</text>
    <text x="102" y="379" class="tiny muted">Priorität · Hoch</text>
    <text x="22" y="392" class="tiny ready">Bereitschaft · bereit</text>

    <rect x="12" y="406" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="424" class="ticket">Konsistentes Icon-System auswählen</text>
    <text x="22" y="438" class="ticket">und integrieren</text>
    <text x="22" y="451" class="tiny muted">Status · Offen</text>
    <text x="102" y="451" class="tiny muted">Priorität · Normal</text>
    <text x="22" y="464" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="478" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="496" class="ticket">Ticketnavigation, Liste und Filter</text>
    <text x="22" y="510" class="ticket">neu gestalten</text>
    <text x="22" y="523" class="tiny muted">Status · Offen</text>
    <text x="102" y="523" class="tiny muted">Priorität · Hoch</text>
    <text x="22" y="536" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="550" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="568" class="ticket">Ticketdetail und Bearbeitungsfluss</text>
    <text x="22" y="582" class="ticket">verbessern</text>
    <text x="22" y="595" class="tiny muted">Status · Offen</text>
    <text x="102" y="595" class="tiny muted">Priorität · Hoch</text>
    <text x="22" y="608" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="622" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="640" class="ticket">Planungsdokumente und Projektübersicht</text>
    <text x="22" y="654" class="ticket">gestalten</text>
    <text x="22" y="667" class="tiny muted">Status · Offen</text>
    <text x="102" y="667" class="tiny muted">Priorität · Normal</text>
    <text x="22" y="680" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="694" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="712" class="ticket">Responsive Darstellung und</text>
    <text x="22" y="726" class="ticket">Barrierefreiheit ausarbeiten</text>
    <text x="22" y="739" class="tiny muted">Status · Offen</text>
    <text x="102" y="739" class="tiny muted">Priorität · Normal</text>
    <text x="22" y="752" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="766" width="296" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="784" class="ticket">UI visuell prüfen und verfeinern</text>
    <text x="22" y="811" class="tiny muted">Status · Offen</text>
    <text x="102" y="811" class="tiny muted">Priorität · Normal</text>
    <text x="22" y="824" class="tiny critical">Bereitschaft · blockiert</text>
  </g>

  <text x="14" y="856" class="tiny muted">Weitere 3 Arbeitspakete · nach unten scrollen</text>
  <text x="14" y="880" class="tiny muted">Auswahl öffnet Detail; Zurück erhält Filter und Listenposition.</text>
</svg>

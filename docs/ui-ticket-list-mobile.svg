<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — mobile Ticketliste</title>
  <desc id="desc">Statische mobile Listenansicht für die zehn direkten Arbeitspakete des UI-Programms. Sie zeigt sieben echte heist-Tickets mit gespeichertem Status, Priorität und getrenntem Bereitschaftshinweis, einen 44-Pixel-Einstieg in kombinierbare Filter für Status, Priorität, Labels und Hierarchiebereich sowie drei weitere scrollbare Einträge.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 21px; font-weight: 650; }
      .ticket { font-size: 13px; font-weight: 600; }
      .ready { fill: #14532D; }
      .critical { fill: #9B1C1C; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
      .nav-icon { fill: none; stroke: #5A687A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .nav-icon-active { fill: none; stroke: #2457A7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="390" height="844" fill="#F6F7F9"/>

  <rect width="390" height="58" fill="#FFFFFF"/>
  <path d="M0 57.5H390" stroke="#D8DEE7"/>
  <rect x="16" y="14" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M24.75 23.375h12.5M24.75 28.375h12.5M24.75 33.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="56" y="28" font-size="14" font-weight="650">Heistman</text>
  <text x="56" y="43" class="tiny muted">heistman</text>
  <rect x="242" y="7" width="132" height="44" rx="6" fill="#2457A7"/>
  <path d="M254 29h10m-5-5v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="270" y="33" class="small inverse" font-weight="600">Ticket erstellen</text>

  <rect x="12" y="65" width="366" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="29" cy="87" r="5" fill="none" stroke="#5A687A" stroke-width="1.3"/>
  <path d="m32.5 90.5 3 3" stroke="#5A687A" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="91" class="small muted">Im Projekt suchen</text>

  <rect y="114" width="390" height="44" fill="#FFFFFF"/>
  <path d="M0 157.5H390" stroke="#D8DEE7"/>
  <use href="#nav-house" x="13" y="126" width="20" height="20" class="nav-icon"/>
  <text x="39" y="141" class="small muted">Übersicht</text>
  <use href="#nav-ticket" x="120" y="126" width="20" height="20" class="nav-icon-active"/>
  <text x="146" y="141" class="small blue" font-weight="650">Tickets</text>
  <use href="#nav-documents" x="205" y="126" width="20" height="20" class="nav-icon"/>
  <text x="231" y="141" class="small muted">Planungsdokumente</text>
  <rect x="118" y="154" width="74" height="3" rx="1.5" fill="#2457A7"/>

  <text x="16" y="184" class="tiny muted">TICKETS · UI-PROGRAMM</text>
  <text x="16" y="211" class="title">UI-Programm</text>
  <text x="16" y="232" class="small muted">10 direkte Arbeitspakete · 1 in Arbeit</text>

  <rect x="12" y="244" width="366" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
  <text x="28" y="271" class="small">Filter: Status · Priorität · Labels · Bereich</text>
  <text x="357" y="271" class="small muted" text-anchor="end">▾</text>

  <g>
    <rect x="12" y="298" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="316" class="ticket">UI-Richtung und Informationsarchitektur</text>
    <text x="24" y="331" class="ticket">festlegen</text>
    <text x="24" y="344" class="tiny muted">Status · Offen</text>
    <text x="105" y="344" class="tiny muted">Priorität · Hoch</text>
    <text x="24" y="358" class="tiny ready">Bereitschaft · bereit</text>

    <rect x="12" y="370" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="388" class="ticket">Konsistentes Icon-System auswählen</text>
    <text x="24" y="403" class="ticket">und integrieren</text>
    <text x="24" y="416" class="tiny muted">Status · Offen</text>
    <text x="105" y="416" class="tiny muted">Priorität · Normal</text>
    <text x="24" y="430" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="442" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="460" class="ticket">Ticketnavigation, Liste und Filter</text>
    <text x="24" y="475" class="ticket">neu gestalten</text>
    <text x="24" y="488" class="tiny muted">Status · Offen</text>
    <text x="105" y="488" class="tiny muted">Priorität · Hoch</text>
    <text x="24" y="502" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="514" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="532" class="ticket">Ticketdetail und Bearbeitungsfluss</text>
    <text x="24" y="547" class="ticket">verbessern</text>
    <text x="24" y="560" class="tiny muted">Status · Offen</text>
    <text x="105" y="560" class="tiny muted">Priorität · Hoch</text>
    <text x="24" y="574" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="586" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="604" class="ticket">Planungsdokumente und Projektübersicht</text>
    <text x="24" y="619" class="ticket">gestalten</text>
    <text x="24" y="632" class="tiny muted">Status · Offen</text>
    <text x="105" y="632" class="tiny muted">Priorität · Normal</text>
    <text x="24" y="646" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="658" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="676" class="ticket">Responsive Darstellung und</text>
    <text x="24" y="691" class="ticket">Barrierefreiheit ausarbeiten</text>
    <text x="24" y="704" class="tiny muted">Status · Offen</text>
    <text x="105" y="704" class="tiny muted">Priorität · Normal</text>
    <text x="24" y="718" class="tiny critical">Bereitschaft · blockiert</text>

    <rect x="12" y="730" width="366" height="68" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="24" y="748" class="ticket">UI visuell prüfen und verfeinern</text>
    <text x="24" y="776" class="tiny muted">Status · Offen</text>
    <text x="105" y="776" class="tiny muted">Priorität · Normal</text>
    <text x="24" y="790" class="tiny critical">Bereitschaft · blockiert</text>
  </g>

  <text x="16" y="820" class="tiny muted">Weitere 3 Arbeitspakete · nach unten scrollen</text>
  <text x="16" y="840" class="tiny muted">Auswahl öffnet das Detail; Zurück erhält Filter und Listenposition.</text>
</svg>

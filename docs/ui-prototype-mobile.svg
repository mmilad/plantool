<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Planus Manus UI-Entwurf — mobiler Ticketdetailzustand</title>
  <desc id="desc">Statischer Mobilentwurf mit sichtbarer Rückkehr zur Ticketliste, Elternkontext, Ticketstatus, Priorität und separat benannter Blockerbereitschaft.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — globale Suche</title>
  <desc id="desc">Statische Desktopvorschau für globale Projektsuche. Keyword-Suche ist der heutige Standard. Eine spätere lokale semantische Suche mit ONNX und SQLite bleibt optional und zeigt transparent Modell-, Index- und Fallbackzustände.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 12px; font-weight: 600; }
      .section { font-size: 16px; font-weight: 650; }
      .title { font-size: 24px; font-weight: 650; }
      .blue { fill: #2457A7; }
      .critical { fill: #9B1C1C; }
      .inverse { fill: #FFFFFF; }
    </style>

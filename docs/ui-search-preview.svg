  <text x="950" y="367" class="tiny muted">all-MiniLM-L6-v2 · lokal</text>
  <circle cx="929" cy="405" r="9" fill="#EAF1FD" stroke="#2457A7"/>
  <path d="M925 405h8m-4-4v8" stroke="#2457A7" stroke-width="1.3" stroke-linecap="round"/>
  <text x="950" y="402" class="label">SQLite-Vektorindex</text>
  <text x="950" y="421" class="tiny muted">abgeleitet und rebuildbar</text>

  <rect x="916" y="449" width="300" height="102" rx="7" fill="#F6F7F9" stroke="#D8DEE7"/>
  <text x="936" y="475" class="label">Bereitschaft</text>
  <text x="936" y="498" class="small muted">Semantikmodus erscheint nur,</text>
  <text x="936" y="517" class="small muted">wenn Modell und Index bereit sind.</text>
  <text x="936" y="538" class="small muted">Keine stillen leeren Ergebnisse.</text>

  <rect x="916" y="568" width="300" height="130" rx="7" fill="#FFF8E8" stroke="#E7D5A5"/>
  <path d="M936 588h12v12h-12z" fill="none" stroke="#8A5A00" stroke-width="1.4"/>
  <path d="M939 594h6m-6 3h6" stroke="#8A5A00" stroke-width="1.2" stroke-linecap="round"/>
  <text x="958" y="599" class="label">Fallback bei Problemen</text>
  <text x="936" y="628" class="small">Modell oder Index nicht bereit?</text>
  <text x="936" y="649" class="small muted">Query bleibt erhalten; Suche läuft</text>
  <text x="936" y="668" class="small muted">sichtbar im Keyword-Modus weiter.</text>
  <text x="916" y="727" class="tiny muted">Repository-Dateien bleiben maßgeblich.</text>

  <text x="40" y="906" class="tiny muted">Entwurf zur Abstimmung · Beispielschnipsel und Reihenfolge sind illustrativ, keine aktuelle Suchantwort.</text>

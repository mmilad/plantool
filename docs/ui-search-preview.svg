  <text x="60" y="461" class="small muted">Ticket-ID · 01a189a9…8942</text>
  <text x="60" y="483" class="body">Eigenständiges UI-Programm</text>
  <rect x="766" y="414" width="74" height="24" rx="12" fill="#F0F3F7"/>
  <text x="783" y="430" class="tiny" font-weight="600">Offen</text>

  <rect x="40" y="520" width="824" height="112" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/>
  <rect x="60" y="540" width="94" height="22" rx="11" fill="#F0F3F7"/>
  <text x="72" y="555" class="tiny" font-weight="600">KOMMENTAR</text>
  <text x="170" y="557" class="section">Kommentar zu „Ticketauswahl über stabile URLs …“</text>
  <text x="60" y="587" class="small muted">Öffnet das Ticket und fokussiert diesen Beitrag</text>
  <text x="60" y="609" class="body">„UI-Review 2026-10-30: Live-Auswahl des fortlaufenden Review-Tickets …“</text>

  <rect x="40" y="646" width="824" height="106" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/>
  <rect x="60" y="666" width="58" height="22" rx="11" fill="#F0F3F7"/>
  <text x="75" y="681" class="tiny" font-weight="600">ZIEL</text>
  <text x="134" y="683" class="section">Eine klare, moderne Jira-inspirierte Planungsoberfläche gestalten</text>
  <text x="60" y="713" class="small muted">Ziel · öffnet den Dokumentleser</text>
  <text x="60" y="735" class="body">„Klare Informationsarchitektur und effizienter Arbeitsfluss …“</text>

  <rect x="40" y="772" width="824" height="112" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/>
  <rect x="60" y="792" width="68" height="22" rx="11" fill="#F0F3F7"/>
  <text x="76" y="807" class="tiny" font-weight="600">PLAN</text>
  <text x="142" y="809" class="section">Fortlaufender UI-Review und Jira-inspirierte Verbesserung</text>
  <text x="60" y="837" class="small muted">Planungsdokument · öffnet den Dokumentleser</text>
  <text x="60" y="861" class="body">„Bei jeder UI-Planungsrunde: Oberfläche ansehen, vorhandene UI-Tickets und Zugehörigkeiten prüfen …“</text>

  <rect x="892" y="244" width="348" height="508" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="916" y="279" class="section">Spätere Ausbaustufe</text>
  <text x="916" y="303" class="small muted">Lokale semantische Suche · nicht Teil des MVP</text>
  <path d="M916 321H1216" stroke="#D8DEE7"/>
  <circle cx="929" cy="351" r="9" fill="#EAF1FD" stroke="#2457A7"/>
  <path d="M925 351h8m-4-4v8" stroke="#2457A7" stroke-width="1.3" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — Freie Ticketlabels eingeben</title>
  <desc id="desc">Desktop- und 320-Pixel-Zustand zeigen Labels als freie Zeichenfolgen, nicht als Auswahl aus einem vorhandenen Katalog. Ein Beispielchip ist als illustrativ markiert, da alle 45 aktuellen Tickets leere Label-Listen haben.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .body { font-size: 13px; }
      .heading { font-size: 16px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 600; }
      .surface { fill: #FFFFFF; stroke: #D8DEE7; }
      .control { fill: #FFFFFF; stroke: #768294; }
      .chip { fill: #F0F3F7; stroke: #D8DEE7; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="960" height="690" fill="#F6F7F9"/>
  <text x="20" y="30" font-size="19" font-weight="650">Ticketlabels · freier Text statt erfundener Liste</text>
  <text x="20" y="51" class="small muted">Vorschlag zur Abstimmung · Beispielchip ist illustrativ; alle 45 aktuellen Tickets haben labels=[]</text>

  <g transform="translate(20 70)">
    <rect width="600" height="590" rx="9" class="surface"/>
    <text x="24" y="38" class="tiny muted" font-weight="650">DESKTOP · 40PX BEDIENFLÄCHEN</text>
    <text x="24" y="76" class="heading">Labels <tspan class="muted" font-weight="400">(optional)</tspan></text>
    <text x="24" y="101" class="small muted">Freie Projektlabels als Text ergänzen.</text>
    <rect x="24" y="120" width="552" height="48" rx="6" fill="#FFFFFF" stroke="#768294" stroke-dasharray="4 3"/>
    <text x="40" y="150" class="small muted">Noch keine Labels ausgewählt.</text>

    <text x="24" y="207" class="label">Label eingeben</text>
    <rect x="24" y="218" width="402" height="40" rx="5" class="control"/>
    <text x="36" y="243" class="small muted">z. B. review</text>
    <rect x="438" y="218" width="138" height="40" rx="5" class="blue"/>
    <text x="507" y="243" class="small inverse" font-weight="650" text-anchor="middle">Hinzufügen</text>
    <text x="24" y="285" class="small">Enter oder „Hinzufügen“ fügt genau ein Label hinzu.</text>

    <path d="M24 318H576" stroke="#D8DEE7"/>
    <text x="24" y="352" class="tiny muted" font-weight="650">BEISPIEL MIT AUSGEWÄHLTEM LABEL</text>
    <rect x="24" y="368" width="143" height="40" rx="20" class="chip"/>
    <text x="40" y="393" class="small">review</text>
    <rect x="118" y="368" width="40" height="40" rx="20" fill="#FFFFFF" stroke="#768294"/>
    <text x="138" y="393" class="small muted" text-anchor="middle">×</text>
    <text x="24" y="438" class="small muted">Der Chipwert ist ein Beispiel, kein vorhandenes</text>
    <text x="24" y="457" class="small muted">Projektlabel. Entfernen ändert nur den Entwurf.</text>

    <rect x="24" y="488" width="552" height="76" rx="5" fill="#F0F3F7" stroke="#D8DEE7"/>
    <text x="38" y="513" class="tiny muted" font-weight="650">VORSCHLAG ZUM ABSTIMMEN</text>
    <text x="38" y="536" class="small">Leerwerte ablehnen, Außenabstände trimmen, Groß-/Kleinschreibung</text>
    <text x="38" y="554" class="small">erhalten und identische Werte nicht doppelt hinzufügen.</text>
  </g>

  <g transform="translate(640 70)">
    <rect width="300" height="590" rx="12" fill="#FFFFFF" stroke="#D8DEE7"/>
    <rect x="1" y="1" width="298" height="50" rx="11" fill="#FFFFFF"/>
    <path d="M1 50.5H299" stroke="#D8DEE7"/>
    <text x="16" y="31" class="small" font-weight="650">Unterticket anlegen</text>
    <text x="16" y="79" class="tiny muted" font-weight="650">LABELS · MOBIL 320PX</text>
    <text x="16" y="108" class="label">Labels <tspan class="muted" font-weight="400">(optional)</tspan></text>

    <rect x="12" y="120" width="276" height="44" rx="5" class="control"/>
    <text x="24" y="147" class="small muted">Label eingeben</text>
    <rect x="12" y="172" width="276" height="44" rx="5" class="blue"/>
    <text x="150" y="199" class="small inverse" font-weight="650" text-anchor="middle">Hinzufügen</text>

    <text x="16" y="250" class="tiny muted">BEISPIELCHIP · NUR ILLUSTRATIV</text>
    <rect x="12" y="263" width="168" height="44" rx="22" class="chip"/>
    <text x="28" y="290" class="small">review</text>
    <rect x="124" y="263" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#768294"/>
    <text x="146" y="291" class="small muted" text-anchor="middle">×</text>

    <text x="16" y="342" class="small muted">Keine Vorschläge, bis echte</text>
    <text x="16" y="361" class="small muted">Projektlabels vorhanden sind.</text>
    <text x="16" y="397" class="small muted">Enter funktioniert auch mit</text>
    <text x="16" y="416" class="small muted">Button und Screenreader.</text>
    <text x="16" y="435" class="small muted">Touch nutzt dieselben Aktionen.</text>

    <rect x="12" y="452" width="276" height="92" rx="5" fill="#F0F3F7" stroke="#D8DEE7"/>
    <text x="24" y="477" class="tiny muted" font-weight="650">DATENVERTRAG</text>
    <text x="24" y="500" class="small">Labelwerte bleiben Strings im</text>
    <text x="24" y="519" class="small">bestehenden labels[]-Feld.</text>
  </g>

  <text x="20" y="681" class="tiny muted">Noch keine abgestimmte Taxonomie oder Vorschlagsquelle; bestehende Labelwerte später aus einer Test-Fixture prüfen.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="810" height="930" viewBox="0 0 810 930" role="img" aria-labelledby="title desc">
  <title id="title">Planus Manus UI-Entwurf — Ticketanlage mobil</title>
  <desc id="desc">Zwei 390-mal-844-Zustände zeigen die getrennte Anlage eines Root-Tickets aus der Projektübersicht und eines direkten Untertickets aus einem geöffneten Elternticket. Beide Formulare haben sichtbare Feldnamen, Status- und Prioritätsdefaults, optionale Labels sowie klar benannte Aktionen.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 21px; font-weight: 650; }
      .section { font-size: 14px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 600; }
      .inverse { fill: #FFFFFF; }
      .blue { fill: #2457A7; }
      .panel { fill: #FFFFFF; stroke: #D8DEE7; }
      .control { fill: #FFFFFF; stroke: #768294; }
    </style>
  </defs>
  <rect width="810" height="930" fill="#FFFFFF"/>
  <text x="16" y="27" font-size="18" font-weight="650">Mobile Ticketanlage</text>
  <text x="16" y="47" class="small muted">Zwei getrennte Einstiege · Root-Ticket und direktes Unterticket</text>
  <text x="24" y="70" class="small blue" font-weight="650">Aus der Projektübersicht · Root-Ticket</text>
  <text x="424" y="70" class="small blue" font-weight="650">Aus dem Elternticket · Unterticket</text>

  <g transform="translate(12 82)">
    <rect width="390" height="844" rx="12" fill="#F6F7F9" stroke="#D8DEE7"/>
    <rect x="1" y="1" width="388" height="58" rx="11" fill="#FFFFFF"/>
    <path d="M1 58.5H389" stroke="#D8DEE7"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2457A7"/>
    <path d="M22.75 23.375h12.5M22.75 28.375h12.5M22.75 33.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
    <text x="54" y="29" font-size="14" font-weight="650">Planus Manus</text>
    <text x="54" y="44" class="tiny muted">planus-manus</text>

    <text x="18" y="94" class="title">Ticket erstellen</text>
    <text x="18" y="115" class="small muted">Neues Ticket auf Projektebene</text>
    <rect x="12" y="128" width="366" height="50" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="26" y="149" class="tiny muted">PROJEKT</text>
    <text x="26" y="168" class="small">planus-manus · ohne Elternzuordnung</text>

    <text x="18" y="201" class="label">Titel <tspan fill="#9B1C1C">*</tspan></text>
    <rect x="12" y="209" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="236" class="small muted">Titel des Tickets</text>

    <text x="18" y="271" class="label">Beschreibung <tspan class="muted" font-weight="400">(optional)</tspan></text>
    <rect x="12" y="279" width="366" height="84" rx="6" class="control"/>
    <text x="26" y="306" class="small muted">Ziel und erwartetes Ergebnis</text>
    <text x="26" y="324" class="small muted">kurz beschreiben</text>

    <text x="18" y="384" class="label">Status</text>
    <rect x="12" y="392" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="419" class="small">Offen</text>
    <text x="358" y="419" class="small muted" text-anchor="end">▾</text>

    <text x="18" y="457" class="label">Priorität</text>
    <rect x="12" y="465" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="492" class="small">Normal</text>
    <text x="358" y="492" class="small muted" text-anchor="end">▾</text>

    <text x="18" y="530" class="label">Labels <tspan class="muted" font-weight="400">(optional)</tspan></text>
    <rect x="12" y="538" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="565" class="small muted">Label hinzufügen</text>

    <rect x="12" y="600" width="112" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
    <text x="68" y="627" class="small" text-anchor="middle">Abbrechen</text>
    <rect x="132" y="600" width="246" height="44" rx="6" fill="#2457A7"/>
    <text x="255" y="627" class="small inverse" font-weight="650" text-anchor="middle">Ticket erstellen</text>
    <text x="18" y="674" class="tiny muted">Nach dem Speichern erscheint das Root-Ticket in der Projektliste.</text>
  </g>

  <g transform="translate(412 82)">
    <rect width="390" height="844" rx="12" fill="#F6F7F9" stroke="#D8DEE7"/>
    <rect x="1" y="1" width="388" height="58" rx="11" fill="#FFFFFF"/>
    <path d="M1 58.5H389" stroke="#D8DEE7"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2457A7"/>
    <path d="M22.75 23.375h12.5M22.75 28.375h12.5M22.75 33.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
    <text x="54" y="29" font-size="14" font-weight="650">Planus Manus</text>
    <text x="54" y="44" class="tiny muted">planus-manus</text>

    <text x="18" y="94" class="title">Unterticket anlegen</text>
    <text x="18" y="115" class="small muted">Direkt aus dem geöffneten Elternticket</text>
    <rect x="12" y="128" width="366" height="76" rx="6" fill="#EAF1FD" stroke="#B9CBE8"/>
    <text x="26" y="148" class="tiny blue" font-weight="650">ELTERN-TICKET · DIREKT DARÜBER</text>
    <text x="26" y="169" class="small">Planungsdokumente und Projektübersicht</text>
    <text x="26" y="187" class="small">gestalten</text>

    <text x="18" y="227" class="label">Titel <tspan fill="#9B1C1C">*</tspan></text>
    <rect x="12" y="235" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="262" class="small muted">Titel des Untertickets</text>

    <text x="18" y="297" class="label">Beschreibung <tspan class="muted" font-weight="400">(optional)</tspan></text>
    <rect x="12" y="305" width="366" height="84" rx="6" class="control"/>
    <text x="26" y="332" class="small muted">Ziel und erwartetes Ergebnis</text>
    <text x="26" y="350" class="small muted">kurz beschreiben</text>

    <text x="18" y="410" class="label">Status</text>
    <rect x="12" y="418" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="445" class="small">Offen</text>
    <text x="358" y="445" class="small muted" text-anchor="end">▾</text>

    <text x="18" y="483" class="label">Priorität</text>
    <rect x="12" y="491" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="518" class="small">Normal</text>
    <text x="358" y="518" class="small muted" text-anchor="end">▾</text>

    <text x="18" y="556" class="label">Labels <tspan class="muted" font-weight="400">(optional)</tspan></text>
    <rect x="12" y="564" width="366" height="44" rx="6" class="control"/>
    <text x="26" y="591" class="small muted">Label hinzufügen</text>

    <text x="18" y="630" class="tiny muted">Status folgt dem Projektstandard; Elternstatus</text>
    <text x="18" y="646" class="tiny muted">bleibt unverändert.</text>
    <rect x="12" y="666" width="112" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
    <text x="68" y="693" class="small" text-anchor="middle">Abbrechen</text>
    <rect x="132" y="666" width="246" height="44" rx="6" fill="#2457A7"/>
    <text x="255" y="693" class="small inverse" font-weight="650" text-anchor="middle">Unterticket anlegen</text>
    <text x="18" y="739" class="tiny muted">Das neue Kind erscheint im Elternticket.</text>
  </g>
</svg>

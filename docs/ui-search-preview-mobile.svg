<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — mobile globale Suche</title>
  <desc id="desc">Statischer 390-mal-844-Entwurf für mobile Keyword-Suchergebnisse mit 44-Pixel-Zielen, Typauswahl, getrennten Trefferarten und passenden Ticket-, Kommentar- und Dokumentzielen. Beispiele stimmen mit der 320-Pixel-Suchvorschau überein; semantische Suche bleibt eine spätere optionale Ausbaustufe.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Planus Manus UI-Entwurf — Status-Board</title>
  <desc id="desc">Statische Vorschau eines Boards für die zehn direkten Kinder des UI-Programms; neun stehen im gespeicherten Status „Offen“, eines in „In Arbeit“. Gespeicherte Status bestimmen die Spalte. Jede Karte zeigt die Priorität und getrennte Bereitschaft als Text und bietet eine explizite Statusänderung; Drag-and-drop ist ergänzend. Leere Statusspalten bleiben sichtbar.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 24px; font-weight: 650; }
      .section { font-size: 15px; font-weight: 650; }
      .cardtitle { font-size: 12px; font-weight: 600; }
      .action { font-size: 10px; font-weight: 600; fill: #2457A7; }
      .critical { fill: #9B1C1C; }
      .ready { fill: #14532D; }
      .inverse { fill: #FFFFFF; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="1280" height="920" fill="#F6F7F9"/>

  <rect width="1280" height="64" fill="#FFFFFF"/>
  <path d="M0 63.5H1280" stroke="#D8DEE7"/>
  <rect x="24" y="17" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M32.75 26.375h12.5M32.75 31.375h12.5M32.75 36.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="64" y="30" font-size="15" font-weight="650">Planus Manus</text>
  <text x="64" y="46" class="tiny muted">planus-manus</text>
  <rect x="324" y="12" width="440" height="40" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="344" cy="32" r="6" fill="none" stroke="#5A687A" stroke-width="1.5"/>
  <path d="m348.5 35.5 4 4" stroke="#5A687A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="362" y="37" class="body muted">Im Projekt suchen</text>
  <rect x="1080" y="12" width="176" height="40" rx="6" fill="#2457A7"/>
  <path d="M1098 32h12m-6-6v12" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1118" y="36" font-size="13" font-weight="600" class="inverse">Ticket erstellen</text>

  <rect y="64" width="1280" height="48" fill="#FFFFFF"/>
  <path d="M0 111.5H1280" stroke="#D8DEE7"/>
  <use href="#nav-house" x="24" y="78" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="93" class="small muted">Übersicht</text>
  <use href="#nav-ticket" x="128" y="78" width="20" height="20" fill="none" stroke="#2457A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="93" class="small" fill="#2457A7" font-weight="650">Tickets</text>
  <use href="#nav-documents" x="218" y="78" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="244" y="93" class="small muted">Planungsdokumente</text>
  <rect x="126" y="108" width="74" height="3" rx="1.5" fill="#2457A7"/>

  <text x="32" y="151" class="tiny muted">TICKETS / UI-PROGRAMM</text>
  <text x="32" y="184" class="title">Status-Board</text>
  <text x="32" y="208" class="body muted">UI-Programm · zehn direkte Unteraufgaben · gespeicherter Status steuert die Spalten</text>
  <rect x="1078" y="163" width="178" height="38" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="1100" y="187" class="small">Zur Listenansicht</text>

  <rect x="24" y="232" width="296" height="608" rx="8" fill="#F0F3F7" stroke="#D8DEE7"/>
  <rect x="330" y="232" width="296" height="608" rx="8" fill="#F0F3F7" stroke="#D8DEE7"/>
  <rect x="636" y="232" width="296" height="608" rx="8" fill="#F0F3F7" stroke="#D8DEE7"/>
  <rect x="942" y="232" width="296" height="608" rx="8" fill="#F0F3F7" stroke="#D8DEE7"/>

  <text x="40" y="263" class="section">Offen</text>
  <text x="296" y="263" class="small muted" text-anchor="end">9</text>
  <text x="346" y="263" class="section">In Arbeit</text>
  <text x="602" y="263" class="small muted" text-anchor="end">1</text>
  <text x="652" y="263" class="section">Erledigt</text>
  <text x="908" y="263" class="small muted" text-anchor="end">0</text>
  <text x="958" y="263" class="section">Abgebrochen</text>
  <text x="1214" y="263" class="small muted" text-anchor="end">0</text>

  <g>
    <rect x="32" y="278" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="44" y="298" class="cardtitle">UI-Richtung und Informationsarchitektur</text>
    <text x="44" y="313" class="cardtitle">festlegen</text>
    <text x="44" y="328" class="tiny ready">Bereit</text>
    <text x="180" y="328" class="tiny muted">Priorität · Hoch</text>
    <rect x="44" y="332" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="172" y="357" class="action" text-anchor="middle">Status ändern  ▾</text>

    <rect x="32" y="388" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="44" y="408" class="cardtitle">Konsistentes Icon-System auswählen</text>
    <text x="44" y="423" class="cardtitle">und integrieren</text>
    <text x="44" y="438" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="180" y="438" class="tiny muted">Priorität · Normal</text>
    <rect x="44" y="442" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="172" y="467" class="action" text-anchor="middle">Status ändern  ▾</text>

    <rect x="32" y="498" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="44" y="518" class="cardtitle">Ticketnavigation, Liste und Filter</text>
    <text x="44" y="533" class="cardtitle">neu gestalten</text>
    <text x="44" y="548" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="180" y="548" class="tiny muted">Priorität · Hoch</text>
    <rect x="44" y="552" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="172" y="577" class="action" text-anchor="middle">Status ändern  ▾</text>

    <rect x="32" y="608" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="44" y="628" class="cardtitle">Ticketdetail und Bearbeitungsfluss</text>
    <text x="44" y="643" class="cardtitle">verbessern</text>
    <text x="44" y="658" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="180" y="658" class="tiny muted">Priorität · Hoch</text>
    <rect x="44" y="662" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="172" y="687" class="action" text-anchor="middle">Status ändern  ▾</text>

    <rect x="32" y="718" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="44" y="738" class="cardtitle">Planungsdokumente und</text>
    <text x="44" y="753" class="cardtitle">Projektübersicht gestalten</text>
    <text x="44" y="768" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="180" y="768" class="tiny muted">Priorität · Normal</text>
    <rect x="44" y="772" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="172" y="797" class="action" text-anchor="middle">Status ändern  ▾</text>
  </g>

  <text x="40" y="834" class="tiny muted">Weitere 4 Karten in dieser Spalte · vertikal scrollen</text>

  <rect x="338" y="278" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="350" y="298" class="cardtitle">UI regelmäßig prüfen und den</text>
  <text x="350" y="313" class="cardtitle">pman-Plan nachschärfen</text>
  <text x="350" y="328" class="tiny muted">Laufend</text>
  <text x="485" y="328" class="tiny muted">Priorität · Normal</text>
  <rect x="350" y="332" width="256" height="40" rx="5" fill="#EAF1FD" stroke="#768294"/>
  <text x="478" y="357" class="action" text-anchor="middle">Status ändern  ▾</text>

  <rect x="650" y="278" width="268" height="92" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="670" y="311" class="small muted">Noch keine Tickets in diesem</text>
  <text x="670" y="330" class="small muted">gespeicherten Status.</text>

  <rect x="956" y="278" width="268" height="92" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="976" y="311" class="small muted">Noch keine Tickets in diesem</text>
  <text x="976" y="330" class="small muted">gespeicherten Status.</text>

  <rect x="24" y="856" width="1214" height="42" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="42" y="882" class="small">Blockiert ist ein Hinweis zur Bereitschaft: Die sieben betroffenen Tickets bleiben in „Offen“; keine zusätzliche Blockiert-Spalte.</text>
  <text x="32" y="914" class="tiny muted">Statischer Entwurf · Status ändern ist pro Karte erreichbar; Ziehen bleibt ergänzend · Karten öffnen dasselbe Ticketdetail.</text>
</svg>


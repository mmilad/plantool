<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Planus Manus UI-Entwurf — mobiles Status-Board</title>
  <desc id="desc">Statischer Mobilentwurf eines Status-Boards mit einer vollen Spalte, nativer Auswahl der angezeigten Spalte und neun echten Karten in der Statusspalte Offen aus zehn direkten UI-Programmkindern. Jede Ticketkarte zeigt Priorität und getrennte Bereitschaft als Text und hat eine eigene Statusänderung.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .title { font-size: 21px; font-weight: 650; }
      .cardtitle { font-size: 12px; font-weight: 600; }
      .action { font-size: 12px; font-weight: 600; fill: #2457A7; }
      .critical { fill: #9B1C1C; }
      .ready { fill: #14532D; }
      .inverse { fill: #FFFFFF; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="390" height="844" fill="#F6F7F9"/>

  <rect width="390" height="58" fill="#FFFFFF"/>
  <path d="M0 57.5H390" stroke="#D8DEE7"/>
  <rect x="16" y="14" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M24.75 23.375h12.5M24.75 28.375h12.5M24.75 33.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="56" y="28" font-size="14" font-weight="650">Planus Manus</text>
  <text x="56" y="43" class="tiny muted">planus-manus</text>
  <rect x="242" y="7" width="132" height="44" rx="6" fill="#2457A7"/>
  <path d="M254 29h10m-5-5v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="270" y="33" class="small inverse" font-weight="600">Ticket erstellen</text>

  <rect x="12" y="65" width="366" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="29" cy="87" r="5" fill="none" stroke="#5A687A" stroke-width="1.3"/>
  <path d="m32.5 90.5 3 3" stroke="#5A687A" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="91" class="small muted">Im Projekt suchen</text>

  <rect x="0" y="114" width="390" height="44" fill="#FFFFFF"/>
  <path d="M0 157.5H390" stroke="#D8DEE7"/>
  <use href="#nav-house" x="13" y="126" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="39" y="141" class="small muted">Übersicht</text>
  <use href="#nav-ticket" x="120" y="126" width="20" height="20" fill="none" stroke="#2457A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="141" class="small" fill="#2457A7" font-weight="650">Tickets</text>
  <use href="#nav-documents" x="205" y="126" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="231" y="141" class="small muted">Planungsdokumente</text>
  <rect x="118" y="154" width="74" height="3" rx="1.5" fill="#2457A7"/>

  <rect x="12" y="164" width="366" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <rect x="195" y="164" width="182" height="44" rx="5" fill="#EAF1FD" stroke="#2457A7"/>
  <text x="91" y="193" class="small muted" text-anchor="middle">Liste</text>
  <text x="286" y="193" class="small" fill="#2457A7" font-weight="650" text-anchor="middle">Board</text>

  <text x="16" y="226" class="tiny muted">TICKETS / UI-PROGRAMM</text>
  <text x="16" y="252" class="title">UI-Programm</text>
  <text x="16" y="273" class="small muted">10 direkte Unteraufgaben</text>
  <text x="16" y="298" class="small" font-weight="600">Statusspalte anzeigen</text>
  <rect x="12" y="307" width="366" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
  <text x="28" y="334" class="body">Offen · 9 Tickets</text>
  <path d="m352 323 6 6 6-6" fill="none" stroke="#5A687A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="12" y="359" width="366" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="381" class="cardtitle">UI-Richtung und Informationsarchitektur festlegen</text>
    <rect x="24" y="390" width="342" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="195" y="418" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="28" y="448" class="tiny ready">Bereit</text>
    <text x="230" y="448" class="tiny muted">Priorität · Hoch</text>

    <rect x="12" y="467" width="366" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="489" class="cardtitle">Konsistentes Icon-System auswählen und integrieren</text>
    <rect x="24" y="498" width="342" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="195" y="526" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="28" y="556" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="230" y="556" class="tiny muted">Priorität · Normal</text>

    <rect x="12" y="575" width="366" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="597" class="cardtitle">Ticketnavigation, Liste und Filter neu gestalten</text>
    <rect x="24" y="606" width="342" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="195" y="634" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="28" y="664" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="230" y="664" class="tiny muted">Priorität · Hoch</text>

    <rect x="12" y="683" width="366" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="28" y="705" class="cardtitle">Ticketdetail und Bearbeitungsfluss verbessern</text>
    <rect x="24" y="714" width="342" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="195" y="742" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="28" y="772" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="230" y="772" class="tiny muted">Priorität · Hoch</text>
  </g>

  <text x="16" y="804" class="tiny muted">Weitere 5 Karten · vertikal scrollen</text>
  <text x="16" y="827" class="tiny muted">Spalte wählen zeigt Status; „Status ändern“ bearbeitet das Ticket.</text>
</svg>

  <text x="48" y="541" class="small" font-weight="650">UI regelmäßig prüfen und den pman-Plan nachschärfen</text>
  <path d="m352 520 5 5-5 5" fill="none" stroke="#5A687A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>


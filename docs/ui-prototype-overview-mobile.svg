  <text x="28" y="617" class="tiny">6 durch das gemeinsame UI-Konzept;</text>
  <text x="28" y="633" class="tiny">Visual-QA: Port 4000, Entscheidungen, Beziehungen.</text>
  <text x="28" y="652" class="tiny muted">Direkte UI-Programmkinder, keine Untertickets.</text>

  <rect x="12" y="671" width="366" height="190" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="28" y="697" class="section">Zuletzt geändert</text>
  <text x="28" y="715" class="tiny muted">3 Tickets · nach Änderungsdatum, kein Aktivitätsfeed</text>
  <rect x="24" y="721" width="342" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="36" y="741" class="small" font-weight="600">UI-Review nachschärfen<title>UI regelmäßig prüfen und den pman-Plan nachschärfen</title></text>
  <text x="36" y="757" class="tiny muted">In Arbeit · UI-Programm · 31.10.2026</text>
  <rect x="24" y="767" width="342" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="36" y="787" class="small" font-weight="600">Schlichtes UI-Konzept festhalten<title>Schlichtes UI-Konzept mit klaren Planungsabläufen festhalten</title></text>
  <text x="36" y="803" class="tiny muted">Offen · UI-Richtung · 31.10.2026</text>
  <rect x="24" y="813" width="342" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="36" y="833" class="small" font-weight="600">Status, Rollup und Bereitschaft trennen<title>Gespeicherten Status, Rollup und Blockerbereitschaft getrennt darstellen</title></text>
  <text x="36" y="849" class="tiny muted">Offen · Ticketdetail · 31.10.2026</text>

  <rect x="12" y="871" width="366" height="130" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1070" viewBox="0 0 390 1070" role="img" aria-labelledby="title desc">
  <title id="title">Planus Manus UI-Entwurf — mobile Projektübersicht</title>
  <desc id="desc">Statischer Mobilentwurf bei 390 CSS-Pixeln Breite mit einem 844-Pixel-Erstviewport und vertikal scrollbarem Inhalt. Er zeigt zehn direkte UI-Arbeitspakete, beide bereiten Einstiege, das laufende Review, drei zuletzt geänderte Tickets nach updatedAt, separat benannte Blockerbereitschaft und vorhandene Planungsdokumente. Die Änderungsliste ist kein Aktivitätsfeed; Statuszahlen sind eine pman-Momentaufnahme.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 21px; font-weight: 650; }
      .section { font-size: 15px; font-weight: 650; }
      .critical { fill: #9B1C1C; }
      .ready { fill: #14532D; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>

  <path d="m352 445 5 5-5 5" fill="none" stroke="#5A687A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="12" y="491" width="366" height="70" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="32" cy="513" r="6" fill="#EAF1FD" stroke="#2457A7"/>
  <path d="M29 513h6" stroke="#2457A7" stroke-width="1.4" stroke-linecap="round"/>

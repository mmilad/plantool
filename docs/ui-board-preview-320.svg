<svg xmlns="http://www.w3.org/2000/svg" width="320" height="960" viewBox="0 0 320 960" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — Status-Board bei 320 Pixeln</title>
  <desc id="desc">Statischer schmaler Board-Entwurf mit der Statusspalte Offen, drei von neun offenen direkten Tickets und einem im 844-Pixel-Erstsichtbereich sichtbaren Scrollhinweis. Statusänderungsaktionen, Priorität und Bereitschaft sind klar beschriftet und getrennt.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 20px; font-weight: 650; }
      .ticket { font-size: 12px; font-weight: 600; }
      .action { font-size: 11px; font-weight: 600; fill: #2457A7; }
      .critical { fill: #9B1C1C; }
      .ready { fill: #14532D; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
      .nav-icon { fill: none; stroke: #5A687A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .nav-icon-active { fill: none; stroke: #2457A7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="320" height="960" fill="#F6F7F9"/>

  <rect width="320" height="52" fill="#FFFFFF"/>
  <path d="M0 51.5H320" stroke="#D8DEE7"/>
  <rect x="12" y="11" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M20.75 20.375h12.5M20.75 25.375h12.5M20.75 30.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="52" y="25" font-size="14" font-weight="650">Heistman</text>
  <text x="52" y="40" class="tiny muted">heistman</text>
  <rect x="12" y="57" width="296" height="44" rx="6" fill="#2457A7"/>
  <path d="M110 79h10m-5-5v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="126" y="83" class="small inverse" font-weight="600">Ticket erstellen</text>

  <rect x="12" y="109" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="29" cy="131" r="5" fill="none" stroke="#5A687A" stroke-width="1.3"/>
  <path d="m32.5 134.5 3 3" stroke="#5A687A" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="135" class="small muted">Im Projekt suchen</text>

  <rect y="158" width="320" height="44" fill="#FFFFFF"/>
  <path d="M0 201.5H320" stroke="#D8DEE7"/>
  <use href="#nav-house" x="10" y="170" width="20" height="20" class="nav-icon"/>
  <text x="35" y="185" class="small muted">Übersicht</text>
  <use href="#nav-ticket" x="96" y="170" width="20" height="20" class="nav-icon-active"/>
  <text x="121" y="185" class="small blue" font-weight="650">Tickets</text>
  <use href="#nav-documents" x="172" y="170" width="20" height="20" class="nav-icon"/>
  <text x="198" y="185" class="small muted">Planungsdokumente</text>
  <rect x="94" y="198" width="74" height="3" rx="1.5" fill="#2457A7"/>

  <rect x="12" y="210" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <rect x="160" y="210" width="148" height="44" rx="5" fill="#EAF1FD" stroke="#2457A7"/>
  <text x="86" y="238" class="small muted" text-anchor="middle">Liste</text>
  <text x="234" y="238" class="small blue" font-weight="650" text-anchor="middle">Board</text>

  <text x="14" y="276" class="tiny muted">TICKETS · UI-PROGRAMM</text>
  <text x="14" y="300" class="title">UI-Programm</text>
  <text x="14" y="320" class="tiny muted">10 direkte Arbeitspakete</text>
  <text x="14" y="344" class="small" font-weight="600">Statusspalte anzeigen</text>
  <rect x="12" y="352" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#768294"/>
  <text x="28" y="379" class="small">Offen · 9 Tickets</text>
  <path d="m288 369 6 6 6-6" fill="none" stroke="#5A687A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="12" y="410" width="296" height="118" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="430" class="ticket">UI-Richtung und</text>
    <text x="22" y="445" class="ticket">Informationsarchitektur festlegen</text>
    <rect x="24" y="454" width="272" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="160" y="480" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="22" y="511" class="tiny ready">Bereit</text>
    <text x="174" y="511" class="tiny muted">Priorität · Hoch</text>

    <rect x="12" y="532" width="296" height="118" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="552" class="ticket">Konsistentes Icon-System</text>
    <text x="22" y="567" class="ticket">auswählen und integrieren</text>
    <rect x="24" y="576" width="272" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="160" y="602" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="22" y="633" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="174" y="633" class="tiny muted">Priorität · Normal</text>

    <rect x="12" y="654" width="296" height="118" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
    <text x="22" y="674" class="ticket">Ticketnavigation, Liste</text>
    <text x="22" y="689" class="ticket">und Filter neu gestalten</text>
    <rect x="24" y="698" width="272" height="44" rx="5" fill="#EAF1FD" stroke="#768294"/>
    <text x="160" y="724" class="action" text-anchor="middle">Status ändern  ▾</text>
    <text x="22" y="755" class="tiny critical">Bereitschaft · blockiert</text>
    <text x="174" y="755" class="tiny muted">Priorität · Hoch</text>

  </g>

  <text x="14" y="798" class="tiny muted">Weitere 6 Offen-Karten · vertikal scrollen</text>
  <text x="14" y="820" class="tiny muted">Bereitschaft ist kein gespeicherter Status.</text>
</svg>


  <title id="title">Plan — schlichte Ticketarbeitsfläche nach fp.dev-Referenz</title>
  <desc id="desc">Statischer Desktopentwurf mit kompaktem Kopf, Suche, Ticketliste links und ausgewähltem Ticketdetail rechts. Zehn direkte UI-Programmpakete werden mit vorhandenem plantool-Status und Priorität gezeigt; Filter für Status, Priorität, Labels und Hierarchiebereich sind vorgesehen. Es gibt kein Assignee-Feld.</desc>

  <circle cx="371" cy="520" r="5" fill="#F0F3F7" stroke="#5A687A"/>
  <text x="390" y="525" class="small">Dokumentnavigation und Lesemodus an die pman-API anpassen</text>
  <text x="1174" y="525" class="tiny muted">Offen</text>

  <rect x="352" y="542" width="888" height="40" rx="5" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="371" cy="562" r="5" fill="#F0F3F7" stroke="#5A687A"/>
  <text x="390" y="567" class="small">Projektstartseite mit hilfreichem Arbeitsüberblick planen</text>
  <text x="1174" y="567" class="tiny muted">Offen</text>

  <rect x="352" y="584" width="888" height="40" rx="5" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="371" cy="604" r="5" fill="#F0F3F7" stroke="#5A687A"/>
  <text x="390" y="609" class="small">Aktuellen Projektkontext in der UI eindeutig anzeigen</text>
  <text x="1174" y="609" class="tiny muted">Offen</text>

  <rect x="352" y="626" width="888" height="40" rx="5" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="371" cy="646" r="5" fill="#F0F3F7" stroke="#5A687A"/>
  <text x="390" y="651" class="small">Ziele und Pläne in der UI revision-sicher bearbeiten</text>
  <text x="1174" y="651" class="tiny muted">Offen</text>

  <rect x="352" y="668" width="888" height="40" rx="5" fill="#F0F3F7" stroke="#D8DEE7"/>
  <text x="390" y="693" class="small" fill="#2457A7" font-weight="600">Weitere 2 Unteraufgaben anzeigen</text>
  <path d="m1214 684 5 5-5 5" fill="none" stroke="#2457A7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="352" y="697" class="tiny muted">Vorschau · 6 direkte pman-Unteraufgaben; Icons und finale Texte noch nicht abgestimmt</text>

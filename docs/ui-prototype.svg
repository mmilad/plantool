  <text x="66" y="471" class="tiny muted">Offen · Normal</text>

  <rect x="12" y="483" width="296" height="44" rx="5" fill="#FFFFFF"/>
  <path d="M50 496v17m0-12h6m-6 6h6" stroke="#768294" stroke-width="1.4" stroke-linecap="round"/>
  <text x="66" y="501" class="small">Ziele und Pläne revision-sicher bearbeiten</text>
  <text x="66" y="518" class="tiny muted">Offen · Normal</text>

  <path d="M20 552h280" stroke="#D8DEE7"/>
  <text x="22" y="576" class="tiny muted">Die Ticketliste zeigt gespeicherten Status</text>
  <text x="22" y="592" class="tiny muted">und Priorität; Blocker bleiben separat.</text>

  <!-- Ticket details -->
  <text x="352" y="145" class="small muted">UI-Programm</text>
  <path d="m431 139 4 4-4 4" fill="none" stroke="#768294" stroke-width="1.3"/>
  <text x="445" y="145" class="small muted">Planungsdokumente und Projektübersicht</text>

  <text x="352" y="187" class="title">Planungsdokumente und Projektübersicht</text>
  <text x="352" y="216" font-size="17" font-weight="600">gestalten</text>

  <rect x="352" y="236" width="92" height="28" rx="14" fill="#F0F3F7"/>
  <circle cx="368" cy="250" r="4" fill="#5A687A"/>
  <text x="379" y="254" class="small" font-weight="600">Offen</text>
  <text x="459" y="254" class="small muted">Priorität</text>
  <rect x="514" y="236" width="82" height="28" rx="14" fill="#F0F3F7"/>
  <text x="530" y="254" class="small" font-weight="600">Normal</text>

  <rect x="352" y="280" width="888" height="58" rx="7" fill="#FDECEC" stroke="#F1C6C6"/>
  <path d="M371 299 380 316h-18z" fill="none" stroke="#9B1C1C" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M371 304v5m0 3v.2" stroke="#9B1C1C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="394" y="303" font-size="12" font-weight="650" class="critical">Bereitschaft: Blockiert</text>
  <text x="394" y="321" class="small" fill="#5A687A">Wartet auf „Schlichtes UI-Konzept mit klaren Planungsabläufen festhalten“</text>

  <text x="352" y="378" class="section">Beschreibung</text>
  <text x="352" y="405" class="body">Projektübersicht und Planungsdokumente als getrennte, erreichbare Arbeitsbereiche gestalten.</text>
  <text x="352" y="427" class="body muted">Ziele, Pläne und Entscheidungen erhalten eine eigene Navigation und eine lesbare Detailfläche.</text>


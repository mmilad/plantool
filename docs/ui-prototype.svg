  <rect x="0" y="64" width="1280" height="48" fill="#FFFFFF"/>
  <path d="M0 111.5H1280" stroke="#D8DEE7"/>
  <g font-size="13" font-weight="550">
    <use href="#nav-house" x="24" y="78" width="20" height="20" class="nav-icon"/>
    <text x="50" y="93" class="muted">Übersicht</text>
    <use href="#nav-ticket" x="128" y="78" width="20" height="20" class="nav-icon-active"/>
    <text x="154" y="93" fill="#2457A7">Tickets</text>
    <use href="#nav-documents" x="218" y="78" width="20" height="20" class="nav-icon"/>
    <text x="244" y="93" class="muted">Planungsdokumente</text>
  </g>
  <rect x="126" y="108" width="74" height="3" rx="1.5" fill="#2457A7"/>


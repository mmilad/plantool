  <path d="M32 308v17m0-12h6m-6 6h6" stroke="#768294" stroke-width="1.4" stroke-linecap="round"/>
  <text x="48" y="313" class="small">UI-Richtung und Informationsarchitektur</text>
  <text x="48" y="330" class="tiny muted">Offen · Normal</text>

  <rect x="12" y="342" width="296" height="44" rx="5" fill="#EAF1FD" stroke="#2457A7"/>
  <rect x="24" y="357" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#2457A7"/>

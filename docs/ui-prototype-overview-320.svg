<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1170" viewBox="0 0 320 1170" role="img" aria-labelledby="title desc">
  <title id="title">Heistman UI-Entwurf — Projektübersicht bei 320 Pixeln</title>
  <desc id="desc">Schmaler, statischer Entwurf einer mobilen Projektübersicht. Die primäre Aktion steht in einer eigenen Zeile, Inhalte umbrechen kontrolliert, der Arbeitsstand bleibt von Ticketstatus getrennt und drei zuletzt geänderte Tickets erscheinen nach updatedAt. Die Änderungsliste ist keine Kommentarchronik; datierte Zahlen sind keine Live-Anzeige.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #263445; }
      .muted { fill: #5A687A; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .title { font-size: 21px; font-weight: 650; }
      .section { font-size: 15px; font-weight: 650; }
      .critical { fill: #9B1C1C; }
      .ready { fill: #14532D; }
      .blue { fill: #2457A7; }
      .inverse { fill: #FFFFFF; }
    </style>
    <symbol id="nav-house" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="nav-ticket" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v4a2 2 0 0 0 0 4v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a2 2 0 0 0 0-4V6a1 1 0 0 1 1-1Z"/><path d="M13 5v2m0 3v2m0 3v2"/></symbol>
    <symbol id="nav-documents" viewBox="0 0 24 24"><path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M3 7v14h4M10 12h8m-8 4h8"/></symbol>
  </defs>
  <rect width="320" height="1170" fill="#F6F7F9"/>

  <rect width="320" height="52" fill="#FFFFFF"/>
  <path d="M0 51.5H320" stroke="#D8DEE7"/>
  <rect x="12" y="11" width="30" height="30" rx="8" fill="#2457A7"/>
  <path d="M20.75 20.375h12.5M20.75 25.375h12.5M20.75 30.375h7.5" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="52" y="25" font-size="14" font-weight="650">Heistman</text>
  <text x="52" y="40" class="tiny muted">heistman</text>
  <rect x="12" y="57" width="296" height="44" rx="6" fill="#2457A7"/>
  <path d="M110 79h10m-5-5v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="126" y="83" class="small inverse" font-weight="600">Ticket erstellen</text>

  <rect x="12" y="109" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="29" cy="131" r="5" fill="none" stroke="#5A687A" stroke-width="1.3"/>
  <path d="m32.5 134.5 3 3" stroke="#5A687A" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="135" class="small muted">Im Projekt suchen</text>

  <rect x="0" y="158" width="320" height="44" fill="#FFFFFF"/>
  <path d="M0 201.5H320" stroke="#D8DEE7"/>
  <use href="#nav-house" x="10" y="170" width="20" height="20" fill="none" stroke="#2457A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="35" y="185" class="small blue" font-weight="650">Übersicht</text>
  <use href="#nav-ticket" x="96" y="170" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="121" y="185" class="small muted">Tickets</text>
  <use href="#nav-documents" x="172" y="170" width="20" height="20" fill="none" stroke="#5A687A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="185" class="small muted">Planungsdokumente</text>
  <rect x="9" y="198" width="78" height="3" rx="1.5" fill="#2457A7"/>

  <text x="14" y="225" class="tiny muted">UI-PROGRAMM</text>
  <text x="14" y="252" class="title">Projektübersicht</text>
  <text x="14" y="271" class="small muted">Zehn direkte Arbeitspakete</text>

  <rect x="12" y="281" width="296" height="92" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="26" y="306" class="section">Arbeitsstand</text>
  <text x="26" y="329" class="small">2 bereit · 1 in Arbeit</text>
  <text x="26" y="347" class="small">7 blockiert (Bereitschaft)</text>
  <text x="26" y="364" class="tiny muted">Kein gespeicherter Ticketstatus.</text>

  <text x="14" y="399" class="section">Weiterarbeiten</text>

  <text x="46" y="438" class="tiny ready" font-weight="650">ALS NÄCHSTES · OFFEN · HOCH · BEREIT</text>
  <text x="46" y="462" class="small" font-weight="650">UI-Richtung und</text>
  <text x="46" y="479" class="small" font-weight="650">Informationsarchitektur festlegen</text>
  <path d="m286 448 5 5-5 5" fill="none" stroke="#5A687A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 490H296" stroke="#D8DEE7"/>
  <circle cx="30" cy="509" r="6" fill="#E8F5EC" stroke="#14532D"/>
  <path d="m27 509 2 2 4-4" fill="none" stroke="#14532D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="512" class="tiny ready" font-weight="650">EBENFALLS · OFFEN · HOCH · BEREIT</text>
  <text x="46" y="535" class="small" font-weight="650">UI-Server auf Port 4000 starten</text>
  <path d="m286 522 5 5-5 5" fill="none" stroke="#5A687A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="12" y="559" width="296" height="82" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <circle cx="30" cy="581" r="6" fill="#EAF1FD" stroke="#2457A7"/>
  <path d="M27 581h6" stroke="#2457A7" stroke-width="1.4" stroke-linecap="round"/>
  <text x="46" y="584" class="tiny blue" font-weight="650">IN ARBEIT</text>
  <text x="46" y="608" class="small" font-weight="650">UI regelmäßig prüfen und</text>
  <text x="46" y="625" class="small" font-weight="650">den heist-Plan nachschärfen</text>
  <path d="m286 594 5 5-5 5" fill="none" stroke="#5A687A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="12" y="649" width="296" height="104" rx="7" fill="#FDECEC" stroke="#F1C6C6"/>
  <path d="M29 667 36 680H22z" fill="none" stroke="#9B1C1C" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M29 670v4m0 2v.2" stroke="#9B1C1C" stroke-width="1.3" stroke-linecap="round"/>
  <text x="44" y="674" class="small critical" font-weight="650">7 Pakete warten auf</text>
  <text x="44" y="690" class="small critical" font-weight="650">Voraussetzungen</text>
  <text x="26" y="709" class="tiny">6 Pakete direkt vom Konzept blockiert;</text>
  <text x="26" y="724" class="tiny">Visual-QA zusätzlich: Port 4000,</text>
  <text x="26" y="739" class="tiny">Entscheidungen und Beziehungen.</text>

  <rect x="12" y="761" width="296" height="218" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="26" y="787" class="section">Zuletzt geändert</text>
  <text x="26" y="805" class="tiny muted">3 Tickets · nach Änderungsdatum</text>
  <rect x="24" y="811" width="272" height="50" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="34" y="830" class="small" font-weight="600">UI-Review nachschärfen<title>UI regelmäßig prüfen und den heist-Plan nachschärfen</title></text>
  <text x="34" y="846" class="tiny muted">In Arbeit · UI-Programm · 31.10.2026</text>
  <rect x="24" y="863" width="272" height="50" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="34" y="882" class="small" font-weight="600">Schlichtes UI-Konzept festhalten<title>Schlichtes UI-Konzept mit klaren Planungsabläufen festhalten</title></text>
  <text x="34" y="898" class="tiny muted">Offen · UI-Richtung · 31.10.2026</text>
  <rect x="24" y="915" width="272" height="50" rx="6" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="34" y="934" class="small" font-weight="600">Status, Rollup und Bereitschaft trennen<title>Gespeicherten Status, Rollup und Blockerbereitschaft getrennt darstellen</title></text>
  <text x="34" y="950" class="tiny muted">Offen · Ticketdetail · 31.10.2026</text>

  <rect x="12" y="989" width="296" height="130" rx="7" fill="#FFFFFF" stroke="#D8DEE7"/>
  <text x="26" y="1015" class="section">Planungsdokumente</text>
  <text x="26" y="1038" class="small muted">2 Ziele · 2 Pläne · 0 Entscheidungen</text>
  <rect x="24" y="1059" width="272" height="44" rx="6" fill="#EAF1FD" stroke="#768294"/>
  <text x="160" y="1086" class="small blue" font-weight="650" text-anchor="middle">Planungsdokumente öffnen</text>

  <text x="14" y="1143" class="tiny muted">Momentaufnahme · Stand 2026-10-31 · Entwurf</text>
  <text x="14" y="1161" class="tiny muted">Nach updatedAt; Kommentare ändern diese Liste nicht.</text>
</svg>
